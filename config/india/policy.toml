# Instrument: MCX crude-oil futures used as a proxy for diesel (India has no
# liquid ULSD futures). Contract size is declared in litres.

policy_version = "v1-india"
agency_label = "Fixture: mid-size Indian city bus agency (illustrative; Indian scenario)"

instrument = "MCX-CRUDE"
