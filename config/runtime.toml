# Operational settings (NOT part of the evidence hash).
#
# Model choice and the application's API spending limits. The team agreed on
# $10 total for application API usage (24 Oct 2026): $7 for development,
# rehearsals and checkpoints, $3 reserved for the final demonstration and
# judging. One ledger, two phase allowances; never separate budgets per run.
#
# The real hard cap is the prepaid Console balance with auto-reload OFF.
# HedgeProof's spend controller is an additional guard that reserves the
# worst-case cost of each call before sending it.

[models]
# Substantive research decisions.
research = "claude-sonnet-5-5"
# Wiring and plumbing tests (labelled as practice runs).
practice = "claude-haiku-5-5"
effort = "medium"

# USD per million tokens, from the Claude API reference checked 24 Oct 2026.
# Treat as hypotheses to re-check on the Console pricing page before spending.
# cache_write applies the 1.25x multiplier for 5-minute cache writes.
[prices.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_write = 0.125
cache_read = 0.01
# Haiku 5.5 prompts above 100K tokens bill at 0.50 / 2.50; requests are capped
# below that size, and the reservation uses the higher rate if one ever exceeds it.
long_prompt_threshold_tokens = 100000
long_input = 0.50
long_output = 2.50

[prices.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.20

[prices.claude-opus-5-5]
input = 4.00
output = 20.00
cache_write = 5.00
cache_read = 0.20

[api_budget]
total_usd = 10.00
phases = { dev = 7.00, final = 3.00 }
per_run_usd = 1.00

[call_limits]
max_input_tokens_per_request = 60000
max_output_tokens_per_request = 8000
request_timeout_seconds = 120
max_attempts_per_call = 2
max_model_calls_per_run = 30
max_input_tokens_per_run = 400000
max_output_tokens_per_run = 60000
max_wall_seconds_per_run = 900
